<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Il Forte</title>
<meta name="description" content="Il Forte, tower defense gratis di Universo Sportivo: difendi il castello dalle ondate nemiche con 11 difese, 5 mappe, nemici volanti e boss. The Fort, free tower defense game.">
<meta name="theme-color" content="#15120f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600;700&display=swap">
<style>
/* reset */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#15120f}
body{margin:0;font-size:14px}
img,canvas{max-width:100%}
[hidden]{display:none!important}

/* Layout: arcade cabinet — HUD strip, battlefield canvas, command bar with scrolling armory. Single dark theme by choice. */
:root{
  --bg:#15120f; --panel:#221d18; --panel-2:#2c261f; --line:#4a3f33;
  --fg:#efe6d6; --muted:#a89a85; --gold:#f2b33d; --danger:#e0533d; --ok:#7cc26b;
  --f-display:"Press Start 2P", ui-monospace, monospace;
  --f-ui:"Pixelify Sans", ui-rounded, system-ui, sans-serif;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:16px;-webkit-user-select:none;user-select:none;overflow-x:hidden}
#app{position:relative;display:flex;flex-direction:column;gap:8px;padding-inline:16px;padding-block:8px 12px;max-width:860px;margin:0 auto}
.hud{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:12px;color:var(--gold);letter-spacing:.06em;margin-right:auto;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;min-width:0}
.brand small{font-family:var(--f-ui);font-size:13px;color:var(--muted);letter-spacing:0}
.stats{display:contents}
.stat{display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums}
.stat b{font-family:var(--f-display);font-size:12px}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.stat.gold b{color:var(--gold)} .stat.fort b{color:var(--ok)} .stat.fort.low b{color:var(--danger)}
button,.btn{font-family:var(--f-ui);font-size:15px;color:var(--fg);background:var(--panel-2);border:2px solid var(--line);border-radius:4px;padding:6px 10px;cursor:pointer;touch-action:manipulation;text-decoration:none}
button:hover:not(:disabled),.btn:hover{border-color:var(--gold)}
button:focus-visible,.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.42;cursor:not-allowed}
.langs{display:flex;border:2px solid var(--line);border-radius:4px;overflow:hidden}
.langs button{font-family:var(--f-display);font-size:9px;padding:6px 8px;border:0;border-radius:0;background:transparent;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--gold);color:#1b140b}
#stage{position:relative;display:flex;justify-content:center}
#cv{display:block;border:3px solid var(--line);border-radius:4px;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(12,10,8,.86);z-index:5}
.card{background:var(--panel);border:3px solid var(--line);border-radius:6px;padding:20px;max-width:480px;width:100%;display:flex;flex-direction:column;gap:14px;max-height:100%;overflow:auto}
.card h2{font-family:var(--f-display);font-size:16px;color:var(--danger);margin:0;line-height:1.4;text-wrap:balance}
.card h2.win,.card h2.plain{color:var(--gold)}
.card p{margin:0;color:var(--muted);line-height:1.4}
.row{display:flex;gap:8px;flex-wrap:wrap}
/* menu */
#menu{display:flex;flex-direction:column;gap:14px;padding-block:6px}
#menu h1{font-family:var(--f-display);font-size:clamp(20px,5vw,30px);color:var(--gold);margin:0;line-height:1.3;text-wrap:balance}
#menu p{margin:0;color:var(--muted);line-height:1.45;max-width:65ch}
#menu h3{font-family:var(--f-display);font-size:10px;color:var(--muted);margin:0;letter-spacing:.08em;line-height:1.5}
#menu ul{margin:0;padding-left:18px;line-height:1.45;font-size:15px;max-width:65ch}
.maps{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.map{display:flex;flex-direction:column;gap:6px;padding:6px;text-align:left;min-width:0}
.map canvas{width:100%;height:auto;aspect-ratio:17/10;border-radius:2px;display:block}
.map .mn{font-weight:700;font-size:15px}
.map .md{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.map .pips{color:var(--danger);letter-spacing:1px}
.map.on{border-color:var(--gold);background:#3a2f1f}
.big{font-family:var(--f-display);font-size:12px;padding:12px 16px;background:var(--gold);color:#1b140b;border-color:#b5801f}
.big:hover:not(:disabled){border-color:#fff3d6}
.allgames{display:block;width:100%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:clamp(13px,4vw,16px);padding:12px 10px;margin-top:4px}
.results{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-variant-numeric:tabular-nums}
.results span{color:var(--muted)} .results b{font-family:var(--f-display);font-size:12px;color:var(--fg);align-self:center}
#banner{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-family:var(--f-display);font-size:11px;line-height:1.6;text-align:center;color:var(--gold);background:rgba(20,16,12,.9);border:2px solid var(--line);padding:8px 12px;border-radius:4px;pointer-events:none;width:max-content;max-width:calc(100% - 24px);transition:opacity .3s}
#banner small{display:block;font-family:var(--f-ui);font-size:13px;color:var(--fg)}
#game{display:flex;flex-direction:column;gap:8px}
.bar{display:flex;flex-direction:column;gap:6px}
.shop{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.unit{flex:none;width:132px;display:flex;align-items:center;gap:6px;text-align:left;padding:4px 6px;min-width:0;position:relative}
.unit canvas{width:30px;height:30px;flex:none}
.unit .t{display:flex;flex-direction:column;min-width:0}
.unit .n{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit .c{font-size:13px;color:var(--gold);font-variant-numeric:tabular-nums}
.unit .k{position:absolute;top:2px;right:4px;font-size:9px;color:var(--muted);font-family:var(--f-display)}
.unit.on{border-color:var(--gold);background:#3a2f1f}
@media (min-width:820px){.shop{flex-wrap:wrap;overflow:visible}.unit{flex:1 1 140px;width:auto}}
.actions{display:flex;gap:6px 8px;flex-wrap:wrap;align-items:center}
#go{font-family:var(--f-display);font-size:10px;padding:10px 12px;background:var(--danger);border-color:#9c3020;color:#fff}
.next{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:2px;font-variant-numeric:tabular-nums;color:var(--fg)}
.chip img{width:22px;height:22px}
#hint{font-size:14px;color:var(--muted);min-height:1.2em;width:100%}
#hint.warn{color:var(--danger)}
.sel{display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap;background:var(--panel);border:2px solid var(--line);border-radius:4px;padding:6px 10px}
.sel .who{display:flex;flex-direction:column;margin-right:auto;min-width:0}
.sel .who b{color:var(--gold)}
.sel .info{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.spec{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:4px 8px;flex:1 1 150px;max-width:220px}
.spec b{font-size:14px} .spec span{font-size:12px;color:var(--muted)} .spec em{font-style:normal;color:var(--gold);font-size:13px}
@media (max-width:620px){.brand small{display:none}.spec{max-width:none}}
@media (prefers-reduced-motion:reduce){#banner{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="brand"><span id="brand">IL FORTE</span><small id="mapName"></small></div>

  <section id="menu">
    <h1 data-t="title"></h1>
    <p data-t="sub"></p>

  <section id="game" hidden>
    <div id="stage">
      <canvas id="cv"></canvas>

    <div class="bar">

      <div class="sel" id="selPanel" hidden></div>

  <div class="overlay" id="pauseOv" hidden>

  </div>
  <div class="overlay" id="overOv" hidden>
    <div class="card">
      <h2 id="overTitle"></h2>
      <p id="overSub"></p>
      <div class="results">
        <span data-t="reached"></span><b id="rWave">0</b>
        <span data-t="kills"></span><b id="rKills">0</b>
        <span data-t="score"></span><b id="rScore">0</b>
        <span data-t="best"></span><b id="rBest">0</b>

      <div class="row" id="overBtns"></div>
    </div>
  </div>
</div>

    for(let i=0;i<3;i++)for(let j=0;j<3;j++){const x=cx-.24+i*.24,y=cy-.24+j*.24;c.beginPath();c.moveTo(x-.06,y+.06);c.lineTo(x,y-.08);c.lineTo(x+.06,y+.06);c.fill();}

  }else if(type==='corvo'||type==='drago'){

    c.fillStyle=type==='drago'?'#7a221b':'#17151b';
    c.beginPath();c.moveTo(x-.04,y);c.lineTo(x-r*1.5,y-r*.6-fl);c.lineTo(x-r*.9,y+r*.2);c.fill();
    c.beginPath();c.moveTo(x+.04,y);c.lineTo(x+r*1.5,y-r*.6-fl);c.lineTo(x+r*.9,y+r*.2);c.fill();
    c.fillStyle=col;c.beginPath();c.ellipse(x,y,r*.45,r*.7,0,0,7);c.fill();
    c.fillStyle=type==='drago'?'#f2b33d':'#e0b23a';c.beginPath();c.moveTo(x-.04,y-r*.6);c.lineTo(x+.04,y-r*.6);c.lineTo(x,y-r*.9);c.fill();
  }else if(type==='spettro'){
    c.globalAlpha*=.75;c.fillStyle=col;c.beginPath();c.arc(x,y-.04,r,Math.PI,0);
    for(let i=0;i<=4;i++){c.lineTo(x+r-i*r/2,y+r*.8+(i%2?-.06:0)+Math.sin(T*6+i)*.03);}c.fill();c.globalAlpha/=.75;
    c.fillStyle='#1d2433';c.fillRect(x-.09,y-.1,.06,.06);c.fillRect(x+.03,y-.1,.06,.06);
  }else if(type==='gigante'){
    c.fillStyle='#3a4220';c.beginPath();c.arc(x,y,r,0,7);c.fill();c.fillStyle=col;c.beginPath();c.arc(x,y,r-.05,0,7);c.fill();
    c.fillStyle='#5b3e24';c.save();c.translate(x+r*.7,y);c.rotate(-.6+Math.sin(T*3)*.2);c.fillRect(-.04,-.4,.1,.44);c.fillRect(-.07,-.44,.16,.14);c.restore();
    c.fillStyle='#1d1712';c.fillRect(x-.12,y-.1,.06,.06);c.fillRect(x+.04,y-.1,.06,.06);
  }else{
    c.fillStyle='#2a1612';c.beginPath();c.arc(x,y,r,0,7);c.fill();
    c.fillStyle=col;c.beginPath();c.arc(x,y,r-.04,0,7);c.fill();
    if(type==='guaritore'){c.fillStyle='#4caf50';c.fillRect(x-.03,y-.11,.06,.2);c.fillRect(x-.1,y-.04,.2,.06);}
    else if(type==='ladro'){c.fillStyle='#1f3a24';c.beginPath();c.arc(x,y-.03,r*.72,Math.PI*.9,Math.PI*2.1);c.fill();c.fillStyle='#f2b33d';c.fillRect(x+r*.4,y+r*.2,.07,.07);}

  if(e.stunT>0){c.fillStyle=e.frozen?'rgba(191,234,249,.55)':'#f2b33d';if(e.frozen)c.fillRect(x-r-.05,y-r-.05,r*2+.1,r*2+.1);else for(let i=0;i<3;i++){const a=T*6+i*2.1;c.fillRect(x+Math.cos(a)*r*.8-.03,y-r-.1+Math.sin(a)*.05,.06,.06);}}
  if(e.burnT>0){c.fillStyle='#f6a23a';const f=Math.sin(T*20+e.seed)*.04;c.beginPath();c.moveTo(x-.08,y-r*.3);c.lineTo(x+.08,y-r*.3);c.lineTo(x+f,y-r-.12);c.fill();}
  if(e.curseT>0){c.fillStyle='#7cff9e';c.fillRect(x-.03,y-r-.32,.06,.06);}
  if(e.hp<e.max){const w=Math.max(.5,r*2.2);c.fillStyle='#000';c.fillRect(x-w/2,y-r-.2,w,.07);c.fillStyle=d.boss?'#f2b33d':'#e0533d';c.fillRect(x-w/2,y-r-.2,w*Math.max(0,e.hp/e.max),.07);}

/* ================= STATO ================= */
let S=null,running=false;
function newGame(){
  loadMap(mapIdx);resize(true);
  S={gold:M.gold,hp:20,maxHp:20,wave:0,score:0,kills:0,units:[],grid:new Map(),enemies:[],shots:[],parts:[],texts:[],fx:[],zones:[],
     queue:[],spawnT:0,inWave:false,speed:1,paused:false,over:false,won:false,build:null,sel:null,hover:null,fortFlash:0,seen:new Set(),next:null,pathTurn:0};
  S.next=buildWave(1);setBuild(null);selectUnit(null);renderNext();
}
function buildWave(n){
  const pool=[['fante',Math.max(3,10-n*.45)]];
  if(n>=2)pool.push(['cavaliere',5]);
  if(n>=3)pool.push(['ladro',3]);
  if(n>=4)pool.push(['corazzato',4]);
  if(n>=6)pool.push(['corvo',4]);
  if(n>=7)pool.push(['guaritore',2]);
  if(n>=8)pool.push(['spettro',3.5]);
  if(n>=9)pool.push(['golem',2.5]);
  if(n>=12)pool.push(['gigante',2]);
  const sum=pool.reduce((a,b)=>a+b[1],0),q=[];
  const count=6+Math.floor(n*1.7);
  while(q.length<count){
    let r=Math.random()*sum,ty=pool[0][0];for(const[k,w]of pool){r-=w;if(r<=0){ty=k;break;}}
    const grp=ty==='gigante'||ty==='golem'?1:1+Math.floor(Math.random()*3);
    for(let i=0;i<grp&&q.length<count;i++)q.push({ty,gap:i<grp-1?.4:(ty==='cavaliere'||ty==='ladro'?.5:ty==='corvo'?.55:.8)});
  }
  if(n%10===0)q.push({ty:'drago',gap:1.4});
  if(n%5===0&&(n%10!==0||n>=20))q.push({ty:'ariete',gap:1.4});
  return q;
}
function startWave(){
  if(!S||S.inWave||S.over)return;
  S.wave++;S.queue=S.next;S.next=buildWave(S.wave+1);S.spawnT=.3;S.inWave=true;
  const fresh=[...new Set(S.queue.map(q=>q.ty))].filter(k=>!S.seen.has(k));fresh.forEach(k=>S.seen.add(k));
  if(fresh.length){const e=TXT[lang].e;showBanner(t('waveN').replace('{n}',S.wave)+' · '+t('newEnemy'),fresh.map(k=>e[k][0]+': '+e[k][1]).join(' · '),3600);}
  else showBanner(t('waveN').replace('{n}',S.wave));
  renderNext();
}
function spawn(ty,pi,d0,mOverride){
  const D=ENEMIES[ty],n=S.wave-1,m=mOverride??(1+.2*n+.016*n*n)*M.hpm;
  const hp=Math.round(D.hp*m);
  if(pi==null){pi=S.pathTurn%P.length;S.pathTurn++;}
  const p=P[pi],e={type:ty,D,hp,max:hp,m,spd:D.spd*(1+Math.min(.35,n*.012)),d:d0||0,pi,fly:!!D.fly,armor:D.armor,
    slowT:0,slowMul:1,burnT:0,burnDps:0,stunT:0,curseT:0,atkCd:0,block:null,hitT:0,healCd:2,traps:new Set(),seed:Math.random()*9,frozen:false};
  if(e.fly){const s=posAt(p,0);e.fx=Math.max(.2,s[0]);e.fy=Math.max(.2,s[1]);e.tx=16.4;e.ty=M.fr+.5;e.total=Math.hypot(e.tx-e.fx,e.ty-e.fy);}
  else e.total=p.total;
  e.pos=ePos(e,e.d);S.enemies.push(e);return e;
}
function ePos(e,d){if(e.fly){const k=Math.min(1,d/e.total);return[e.fx+(e.tx-e.fx)*k,e.fy+(e.ty-e.fy)*k];}return posAt(P[e.pi],d);}
function hurt(e,dmg,type){
  if(e.hp<=0)return;let d=dmg;
  if(type==='phys'){d=Math.max(d*.3,d-e.armor);if(e.D.ghost)d*=.5;}
  else if(type==='magic'){if(e.D.ghost)d*=1.5;}
  if(e.curseT>0)d*=1.3;
  e.hp-=d;e.hitT=.08;
}
function setSlow(e,mul,time){if(e.D.boss)mul=1-(1-mul)*.5;e.slowMul=e.slowT>0?Math.min(e.slowMul,mul):mul;e.slowT=Math.max(e.slowT,time);}
function setBurn(e,dps,time){e.burnDps=e.burnT>0?Math.max(e.burnDps,dps):dps;e.burnT=Math.max(e.burnT,time);}
function setStun(e,time,frozen){if(e.D.boss)time*=.4;if(time>e.stunT){e.stunT=time;e.frozen=!!frozen;}}
function burst(x,y,col,n,sp){for(let i=0;i<n;i++){const a=Math.random()*7,v=(.5+Math.random())*sp;S.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.35+Math.random()*.3,col,s:.06+Math.random()*.06});}}
function floatText(x,y,s,col){S.texts.push({x,y,s,life:1,col:col||'#f2b33d'});}
function prog(e){return e.d/e.total;}
function canHit(U,e,cx,cy,L){if(e.hp<=0)return false;if(e.fly&&!U.air)return false;const d=Math.hypot(e.pos[0]-cx,e.pos[1]-cy);return d<=L.rng&&(!L.minr||d>=L.minr);}
function pickTarget(u,U,L,cx,cy){
  let best=null,bv=-Infinity;const pr=u.prio||'first';
  for(const e of S.enemies){if(!canHit(U,e,cx,cy,L))continue;
    let v=pr==='last'?-prog(e):pr==='strong'?e.hp:pr==='air'?(e.fly?1e6:0)+prog(e):prog(e);
    if(v>bv){bv=v;best=e;}}
  return best;
}

function update(dt){
  T+=dt;
  if(S.queue.length){S.spawnT-=dt;if(S.spawnT<=0){const q=S.queue.shift();spawn(q.ty);S.spawnT=q.gap;}}
  S.fortFlash=Math.max(0,S.fortFlash-dt);
  // buff stendardi
  const banners=S.units.filter(u=>u.kind==='stendardo');
  for(const u of S.units){u.bD=1;u.bR=1;if(u.kind==='stendardo'||u.kind==='miniera'||u.kind==='trappola')continue;
    for(const b of banners){const L=stats(b);if(Math.hypot(b.c-u.c,b.r-u.r)<=L.rng){u.bD=Math.max(u.bD,L.dmgMul);if(L.rateMul)u.bR=Math.min(u.bR,L.rateMul);}}}
  // nemici
  for(const e of S.enemies){
    e.hitT-=dt;e.slowT-=dt;e.curseT-=dt;
    if(e.burnT>0){e.burnT-=dt;hurt(e,e.burnDps*dt,'true');}
    if(e.D.heal){e.healCd-=dt;if(e.healCd<=0){e.healCd=2.5;let any=false;for(const o of S.enemies)if(o.hp>0&&o.hp<o.max&&Math.hypot(o.pos[0]-e.pos[0],o.pos[1]-e.pos[1])<1.5){o.hp=Math.min(o.max,o.hp+o.max*.12);any=true;}
      if(any)S.fx.push({type:'ring',x:e.pos[0],y:e.pos[1],r:1.5,life:.5,max:.5,col:'124,194,107'});}}
    if(e.stunT>0){e.stunT-=dt;if(e.stunT<=0)e.frozen=false;continue;}
    const mul=e.slowT>0?e.slowMul:1;
    if(e.block&&e.block.down<=0&&!e.block.dead){
      e.atkCd-=dt;if(e.atkCd<=0){e.block.hp-=e.D.atk*(1+(S.wave-1)*.06);e.atkCd=1;burst(e.block.c+.5,e.block.r+.4,'#e2b98f',3,1.2);}
    }else{e.block=null;e.d+=e.spd*mul*dt;}
    e.pos=ePos(e,e.d);
    if(e.d>=e.total-(e.fly?.3:.4)&&e.hp>0){
      e.hp=-1;e.escaped=true;S.hp=Math.max(0,S.hp-e.D.dmg);S.fortFlash=.35;burst(16.1,M.fr+.5,'#9b927f',8,2);
      if(e.D.steal){const s=Math.min(S.gold,e.D.steal);S.gold-=s;if(s)floatText(15.6,M.fr-.2,'-'+s,'#e0533d');}
      if(S.hp<=0)gameOver();
    }
  }
  // unità
  for(const u of S.units){
    const U=UNITS[u.kind],L=stats(u),cx=u.c+.5,cy=u.r+.5;
    if(u.fireT>0)u.fireT-=dt;
    if(U.kind==='block'){
      if(u.down>0){u.down-=dt;if(u.down<=0){u.hp=u.max;burst(cx,cy,'#f6ead2',6,1.2);}continue;}
      if(u.hp<=0){u.down=8;u.targets=[];for(const e of S.enemies)if(e.block===u)e.block=null;burst(cx,cy,'#2f5f9e',12,2);continue;}
      u.targets=u.targets.filter(e=>e.hp>0&&e.block===u);
      if(u.targets.length<L.block){for(const e of S.enemies){if(u.targets.length>=L.block)break;if(e.hp>0&&!e.fly&&!e.block&&Math.hypot(e.pos[0]-cx,e.pos[1]-cy)<.5){e.block=u;u.targets.push(e);}}}
      if(u.targets.length){u.cd-=dt;if(L.heal)u.hp=Math.min(u.max,u.hp+u.max*.03*dt);
        if(u.cd<=0){const hits=L.block>1?u.targets:[u.targets[0]];for(const e of hits){hurt(e,L.dmg*u.bD,'phys');burst(e.pos[0],e.pos[1],'#f6ead2',3,1.5);}u.cd=L.rate*u.bR;}}
      else u.hp=Math.min(u.max,u.hp+u.max*(L.heal||.08)*dt);
      continue;
    }
    if(U.kind==='trap'){
      for(const e of S.enemies){if(e.hp<=0||e.fly||e.traps.has(u))continue;
        if(Math.hypot(e.pos[0]-cx,e.pos[1]-cy)<.42){e.traps.add(u);hurt(e,L.dmg,'phys');if(L.slow)setSlow(e,L.slow,L.st);burst(e.pos[0],e.pos[1],u.spec===0?'#1c1814':'#c9cdd2',5,1.4);}}
      continue;
    }
    if(U.kind==='mine'){if(S.inWave){u.mt=(u.mt??L.period)-dt;if(u.mt<=0){u.mt=L.period;S.gold+=L.gold;S.score+=L.gold;floatText(cx,cy-.3,'+'+L.gold);}}continue;}
    if(U.kind==='buff')continue;
    if(U.kind==='aura'){
      u.tick=(u.tick||0)-dt;let any=false;
      if(u.tick<=0){u.tick=.25;for(const e of S.enemies)if(canHit(U,e,cx,cy,L)){any=true;hurt(e,L.dmg*.25*u.bD,L.magic?'magic':'phys');setBurn(e,L.burn*u.bD,L.bt);}
        if(any)S.fx.push({type:'ring',x:cx,y:cy,r:L.rng,life:.25,max:.25,col:L.magic?'90,140,255':'246,162,58'});}
      continue;
    }
    // torri che sparano
    if(L.aura){for(const e of S.enemies)if(canHit(U,e,cx,cy,L))setSlow(e,L.aura,.25);}
    u.cd-=dt;
    const tg=pickTarget(u,U,L,cx,cy);
    if(tg){u.ang=Math.atan2(tg.pos[1]-cy,tg.pos[0]-cx);
      if(u.cd<=0){u.cd=L.rate*u.bR;u.fireT=.4;fire(u,U,L,tg,cx,cy);}}
  }
  // proiettili
  for(const s of S.shots){
    s.age+=dt;
    if(s.proj==='rock'){const k=Math.min(1,s.age/s.dur);s.x=s.sx+(s.tx-s.sx)*k;s.y=s.sy+(s.ty-s.sy)*k;s.h=Math.sin(Math.PI*k)*1.1;
      if(k>=1){s.done=true;for(const e of S.enemies)if(!e.fly&&Math.hypot(e.pos[0]-s.tx,e.pos[1]-s.ty)<=s.L.spl)hurt(e,s.dmg,'phys');
        burst(s.tx,s.ty,'#8a7f6e',12,2.4);burst(s.tx,s.ty,'#f2b33d',6,2);if(s.L.fire)S.zones.push({x:s.tx,y:s.ty,r:.9,dps:s.L.fire*s.bD,life:3.5});}
      continue;}
    if(s.proj==='bolt'&&s.L.pierce){
      const step=10*dt;s.x+=s.vx*step;s.y+=s.vy*step;s.trav+=step;
      for(const e of S.enemies){if(e.hp<=0||s.hit.has(e))continue;if(Math.hypot(e.pos[0]-s.x,e.pos[1]-s.y)<.35){s.hit.add(e);hurt(e,s.dmg,'phys');burst(e.pos[0],e.pos[1],'#c9cdd2',4,1.6);}}
      if(s.trav>s.L.rng+.5)s.done=true;continue;}
    if(s.tg&&s.tg.hp>0){s.tx=s.tg.pos[0];s.ty=s.tg.pos[1]-(s.tg.fly?.25:0);}
    const dx=s.tx-s.x,dy=s.ty-s.y,dist=Math.hypot(dx,dy),step=s.spd*dt;
    if(dist<=step+.05){
      s.done=true;
      if(s.L.spl){for(const e of S.enemies)if(!e.fly&&Math.hypot(e.pos[0]-s.tx,e.pos[1]-s.ty)<=s.L.spl){hurt(e,s.dmg,'phys');if(s.L.stun)setStun(e,s.L.stun);}
        burst(s.tx,s.ty,'#f2b33d',10,2.5);burst(s.tx,s.ty,'#5a5048',6,1.5);if(s.L.spl>1.4)S.fx.push({type:'ring',x:s.tx,y:s.ty,r:s.L.spl,life:.3,max:.3,col:'242,179,61'});}
      else if(s.tg&&s.tg.hp>0){const e=s.tg;
        if(e.D.evade&&(s.proj==='arrow'||s.proj==='bolt')&&Math.random()<e.D.evade){floatText(e.pos[0],e.pos[1]-.3,t('miss'),'#a89a85');continue;}
        hurt(e,s.dmg,s.dt);
        if(s.L.burn)setBurn(e,s.L.burn*s.bD,s.L.bt);
        if(s.L.slow)setSlow(e,s.L.slow,s.L.st);
        if(s.L.frz&&Math.random()<s.L.frz)setStun(e,1,true);
        burst(s.tx,s.ty,s.proj==='ice'?'#bfeaf9':'#f6ead2',4,1.3);}
    }else{s.x+=dx/dist*step;s.y+=dy/dist*step;s.a=Math.atan2(dy,dx);}
  }
  S.shots=S.shots.filter(s=>!s.done);
  for(const z of S.zones){z.life-=dt;for(const e of S.enemies)if(!e.fly&&Math.hypot(e.pos[0]-z.x,e.pos[1]-z.y)<=z.r)setBurn(e,z.dps,.6);}
  S.zones=S.zones.filter(z=>z.life>0);
  // morti
  const spawned=[];
  for(const e of S.enemies){if(e.hp<=0&&!e.escaped&&!e.gone){e.gone=true;S.gold+=e.D.rew;S.score+=e.D.rew*10;S.kills++;
      floatText(e.pos[0],e.pos[1]-.3,'+'+e.D.rew);burst(e.pos[0],e.pos[1],e.D.col,e.D.boss?24:9,e.D.boss?3:1.8);
      if(e.D.split){for(const o of[-.25,.25]){spawned.push([e.D.split,e.pi,Math.max(0,e.d+o),e.m]);}}}}
  S.enemies=S.enemies.filter(e=>e.hp>0);
  for(const a of spawned)spawn(...a);
  for(const p of S.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.9;p.vy*=.9;p.life-=dt;}
  S.parts=S.parts.filter(p=>p.life>0);
  for(const x of S.texts){x.y-=.6*dt;x.life-=dt;}S.texts=S.texts.filter(x=>x.life>0);
  for(const f of S.fx)f.life-=dt;S.fx=S.fx.filter(f=>f.life>0);
  // fine ondata
  if(S.inWave&&!S.queue.length&&!S.enemies.length&&!S.over){
    S.inWave=false;const b=15+S.wave*3;S.gold+=b;S.score+=b*10;
    let msg=t('cleared')+' · +'+fmt(b);
    const banks=S.units.filter(u=>u.kind==='miniera'&&stats(u).interest);
    if(banks.length){const i=Math.min(80,Math.floor(S.gold*.1));S.gold+=i;msg+=' · '+t('interest')+' +'+fmt(i);}
    showBanner(msg);
    if(S.wave>=WIN_WAVE&&!S.won){S.won=true;saveBest();showEnd(true);}
  }
}
function fire(u,U,L,tg,cx,cy){
  const dmg=L.dmg*u.bD;
  if(U.proj==='zap'){
    const hit=[tg];let last=tg;
    while(hit.length<L.chain){let nb=null,nd=1.9;for(const e of S.enemies){if(e.hp<=0||hit.includes(e))continue;const d=Math.hypot(e.pos[0]-last.pos[0],e.pos[1]-last.pos[1]);if(d<nd){nd=d;nb=e;}}if(!nb)break;hit.push(nb);last=nb;}
    const pts=[[cx,cy-.05]];hit.forEach((e,i)=>{hurt(e,dmg*Math.pow(.85,i),'magic');if(L.curse)e.curseT=L.curse;pts.push([e.pos[0],e.pos[1]-(e.fly?.25:0)]);});
    S.fx.push({type:'bolt',pts,life:.18,max:.18,col:L.curse?'124,255,158':'177,140,255'});return;
  }
  if(U.proj==='rock'){
    const dist=Math.hypot(tg.pos[0]-cx,tg.pos[1]-cy),dur=.5+dist*.12,mul=tg.slowT>0?tg.slowMul:1;
    const lead=tg.stunT>0||tg.block?0:tg.spd*mul*dur;const p=ePos(tg,Math.min(tg.total,tg.d+lead));
    S.shots.push({proj:'rock',sx:cx,sy:cy,x:cx,y:cy,tx:p[0],ty:p[1],dur,age:0,h:0,L,dmg,bD:u.bD});return;
  }
  if(U.proj==='bolt'&&L.pierce){const a=Math.atan2(tg.pos[1]-cy,tg.pos[0]-cx);S.shots.push({proj:'bolt',x:cx,y:cy,vx:Math.cos(a),vy:Math.sin(a),a,trav:0,hit:new Set(),L,dmg,age:0});return;}
  S.shots.push({proj:U.proj,x:cx,y:cy,tg,tx:tg.pos[0],ty:tg.pos[1],spd:U.proj==='ball'?6:U.proj==='bolt'?12:9,L,dmg,dt:U.dt,bD:u.bD,age:0});
}

function draw(){
  ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(bg,0,0);
  ctx.setTransform(dpr*cell,0,0,dpr*cell,0,0);
  if(!S)return;
  const ring=THEMES[M.theme].ring;
  for(const[k,kind]of obsKind)if(kind==='lava'){const[c,r]=k.split(',').map(Number);ctx.fillStyle=`rgba(255,200,80,${.12+.1*Math.sin(T*2+c+r)})`;ctx.fillRect(c+.06,r+.06,.88,.88);}
  if(S.fortFlash>0)drawFort(ctx,M.fr,S.fortFlash);
  for(const z of S.zones){ctx.fillStyle=`rgba(240,120,40,${.25*Math.min(1,z.life)})`;ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,7);ctx.fill();}
  for(const u of S.units)if(u.kind==='trappola')drawUnit(ctx,u,u.c+.5,u.r+.5);
  const h=S.hover;
  if(S.build&&h&&h.c>=0&&h.c<COLS&&h.r>=0&&h.r<ROWS){
    const ok=canPlace(S.build,h.c,h.r)===true;
    ctx.fillStyle=ok?'rgba(124,194,107,.3)':'rgba(224,83,61,.35)';ctx.fillRect(h.c,h.r,1,1);
    const L=UNITS[S.build].lv[0];
    if(L.rng){ctx.strokeStyle=`rgba(${ring},.55)`;ctx.fillStyle=`rgba(${ring},.08)`;ctx.lineWidth=.04;ctx.beginPath();ctx.arc(h.c+.5,h.r+.5,L.rng,0,7);ctx.fill();ctx.stroke();}
    ctx.globalAlpha=.65;drawUnit(ctx,{kind:S.build,lvl:1,c:h.c},h.c+.5,h.r+.5,true);ctx.globalAlpha=1;
  }
  if(S.sel){const u=S.sel,L=stats(u);
    ctx.strokeStyle='#f2b33d';ctx.lineWidth=.05;ctx.strokeRect(u.c+.03,u.r+.03,.94,.94);
    if(L.rng){ctx.strokeStyle='rgba(242,179,61,.7)';ctx.fillStyle='rgba(242,179,61,.08)';ctx.beginPath();ctx.arc(u.c+.5,u.r+.5,L.rng,0,7);ctx.fill();ctx.stroke();
      if(L.minr){ctx.setLineDash([.1,.1]);ctx.beginPath();ctx.arc(u.c+.5,u.r+.5,L.minr,0,7);ctx.stroke();ctx.setLineDash([]);}}}
  for(const u of S.units)if(u.kind!=='soldato'&&u.kind!=='trappola')drawUnit(ctx,u,u.c+.5,u.r+.5);
  const ground=S.enemies.filter(e=>!e.fly).sort((a,b)=>a.pos[1]-b.pos[1]);
  for(const e of ground)drawEnemyAt(ctx,e.type,e.pos[0],e.pos[1],e);
  for(const u of S.units)if(u.kind==='soldato')drawUnit(ctx,u,u.c+.5,u.r+.5);
  for(const e of S.enemies)if(e.fly)drawEnemyAt(ctx,e.type,e.pos[0],e.pos[1],e);
  for(const s of S.shots){
    if(s.proj==='arrow'){ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.a||0);ctx.strokeStyle=s.L.burn?'#f6a23a':'#f6ead2';ctx.lineWidth=.04;ctx.beginPath();ctx.moveTo(-.18,0);ctx.lineTo(.12,0);ctx.stroke();ctx.fillStyle='#c9cdd2';ctx.fillRect(.1,-.03,.06,.06);ctx.restore();}
    else if(s.proj==='bolt'){ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.a||0);ctx.strokeStyle='#d9d2c0';ctx.lineWidth=.07;ctx.beginPath();ctx.moveTo(-.3,0);ctx.lineTo(.2,0);ctx.stroke();ctx.fillStyle='#c9cdd2';ctx.beginPath();ctx.moveTo(.3,0);ctx.lineTo(.16,-.07);ctx.lineTo(.16,.07);ctx.fill();ctx.restore();}
    else if(s.proj==='ball'){ctx.fillStyle='#111';ctx.beginPath();ctx.arc(s.x,s.y,.1,0,7);ctx.fill();}
    else if(s.proj==='rock'){ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(s.x,s.y,.12,.05,0,0,7);ctx.fill();ctx.fillStyle=s.L.fire?'#f08a2a':'#6f685b';ctx.beginPath();ctx.arc(s.x,s.y-s.h,.13,0,7);ctx.fill();}
    else{ctx.fillStyle='#bfeaf9';ctx.beginPath();ctx.arc(s.x,s.y,.08,0,7);ctx.fill();}
  }
  for(const f of S.fx){const a=f.life/f.max;
    if(f.type==='ring'){ctx.strokeStyle=`rgba(${f.col},${a*.6})`;ctx.lineWidth=.06;ctx.beginPath();ctx.arc(f.x,f.y,f.r*(1.1-a*.3),0,7);ctx.stroke();}
    else if(f.type==='bolt'){ctx.strokeStyle=`rgba(${f.col},${a})`;ctx.lineWidth=.07;ctx.beginPath();ctx.moveTo(...f.pts[0]);
      for(let i=1;i<f.pts.length;i++){const[a0,b0]=f.pts[i-1],[a1,b1]=f.pts[i];const mx=(a0+a1)/2+(Math.random()-.5)*.3,my=(b0+b1)/2+(Math.random()-.5)*.3;ctx.lineTo(mx,my);ctx.lineTo(a1,b1);}ctx.stroke();
      ctx.strokeStyle=`rgba(255,255,255,${a})`;ctx.lineWidth=.025;ctx.stroke();}}
  for(const p of S.parts){ctx.globalAlpha=Math.min(1,p.life*2.5);ctx.fillStyle=p.col;ctx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s);}
  ctx.globalAlpha=1;
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.textAlign='center';ctx.font=`${Math.max(9,Math.round(cell*.28))}px "Press Start 2P", monospace`;
  for(const x of S.texts){ctx.globalAlpha=Math.min(1,x.life*2);ctx.fillStyle='#000';ctx.fillText(x.s,x.x*cell+1,x.y*cell+1);ctx.fillStyle=x.col;ctx.fillText(x.s,x.x*cell,x.y*cell);}
  ctx.globalAlpha=1;
}

/* ================= PIAZZAMENTO ================= */
function canPlace(kind,c,r){
  if(c<0||r<0||c>=COLS||r>=ROWS)return'';
  const k=c+','+r;
  if(fortSet.has(k))return t('blocked');
  if(obsSet.has(k))return t('blocked');
  if(S.grid.has(k))return t('occupied');
  const onPath=pathSet.has(k);
  if(UNITS[kind].place==='grass'&&onPath)return t('needGrass');
  if(UNITS[kind].place==='path'&&!onPath)return t('needPath');
  if(S.gold<UNITS[kind].cost)return t('poor');
  return true;
}
function place(kind,c,r){
  const ok=canPlace(kind,c,r);if(ok!==true){if(ok)hint(ok,true);return;}
  const U=UNITS[kind],L=U.lv[0];
  const u={kind,c,r,lvl:1,spec:null,cd:0,ang:-Math.PI/2,spent:U.cost,prio:'first',bD:1,bR:1};
  if(kind==='soldato'){u.hp=u.max=L.hp;u.targets=[];u.down=0;}
  S.gold-=U.cost;S.units.push(u);S.grid.set(c+','+r,u);burst(c+.5,r+.5,'#e8d9b8',8,1.4);
  if(S.gold<U.cost)setBuild(null);
}
function upgradeCost(u){const U=UNITS[u.kind];return u.lvl<3?U.up[u.lvl-1]:null;}
function upgrade(){
  const u=S.sel;if(!u||u.lvl>=3)return;const cost=upgradeCost(u);
  if(S.gold<cost){hint(t('poor'),true);return;}
  S.gold-=cost;u.spent+=cost;u.lvl++;
  if(u.kind==='soldato'){u.max=stats(u).hp;u.hp=u.max;}
  burst(u.c+.5,u.r+.5,'#f2b33d',12,2);refreshSel();
}
function specialize(i){
  const u=S.sel;if(!u||u.lvl!==3||u.spec!=null)return;const sp=UNITS[u.kind].spec[i];
  if(S.gold<sp.cost){hint(t('poor'),true);return;}
  S.gold-=sp.cost;u.spent+=sp.cost;u.spec=i;u.lvl=4;
  if(u.kind==='soldato'){u.max=stats(u).hp;u.hp=u.max;u.down=0;}
  burst(u.c+.5,u.r+.5,i?'#e0533d':'#f2b33d',20,2.6);S.fx.push({type:'ring',x:u.c+.5,y:u.r+.5,r:1,life:.4,max:.4,col:'242,179,61'});refreshSel();
}
function sell(){
  const u=S.sel;if(!u)return;const v=Math.floor(u.spent*.6);
  S.gold+=v;floatText(u.c+.5,u.r+.3,'+'+fmt(v));
  for(const e of S.enemies){if(e.block===u)e.block=null;}
  S.units=S.units.filter(x=>x!==u);S.grid.delete(u.c+','+u.r);selectUnit(null);
}
function repair(){if(!S||S.hp>=S.maxHp)return;const c=repairCost();if(S.gold<c){hint(t('poor'),true);return;}S.gold-=c;S.hp=Math.min(S.maxHp,S.hp+4);burst(16.5,M.fr+.5,'#7cc26b',12,1.6);}
function repairCost(){return 60+S.wave*4;}

    const rec=document.createElement('span');rec.textContent=bw?t('bestW').replace('{w}',bw.wave):t('noBest');
    md.append(pips,rec);
    b.append(c,nm,md);b.onclick=()=>{mapIdx=i;store.set('forte_map',i);renderMaps();};b.ondblclick=play;box.append(b);
  });
  loadMap(mapIdx);
}
let endState=null;
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));
  $('#brand').textContent=t('brand');document.title=t('title');
  document.querySelectorAll('#langGroup button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));
  $('#langGroup').setAttribute('aria-label',t('langLabel'));$('#cv').setAttribute('aria-label',t('field'));
  $('#howto').innerHTML='';for(const l of t('howto')){const li=document.createElement('li');li.textContent=l;$('#howto').append(li);}
  document.querySelectorAll('.unit').forEach(b=>b.querySelector('.n').textContent=TXT[lang].u[b.dataset.k][0]);
  $('#mapName').textContent=S&&M?M.name[lang]:'';
  if(!$('#menu').hidden)renderMaps();
  last={};
  if(S){updUI();refreshSel();renderNext();if(S.build)setBuild(S.build);else if(!$('#hint').classList.contains('warn'))hint('');if(endState!=null&&!$('#overOv').hidden)renderEnd(endState);}
  const b=$('#banner');if(!b.hidden){b.style.opacity=0;b.hidden=true;}
}
document.querySelectorAll('#langGroup button').forEach(b=>b.onclick=()=>{if(lang===b.dataset.lang)return;lang=b.dataset.lang;store.set('forte_lang',lang);applyLang();});

function renderEnd(win){
  const all=bestAll(),b=all[M.id]||{score:0};
  $('#overTitle').textContent=win?t('victory'):t('fallen');$('#overTitle').classList.toggle('win',win);
  $('#overSub').textContent=win?t('victorySub'):'';$('#overSub').hidden=!win;
  $('#rWave').textContent=S.wave;$('#rKills').textContent=fmt(S.kills);$('#rScore').textContent=fmt(S.score);$('#rBest').textContent=fmt(b.score);
  const btns=$('#overBtns');btns.innerHTML='';
  const mk=(label,cls,fn)=>{const x=document.createElement('button');x.textContent=label;if(cls)x.className=cls;x.onclick=fn;btns.append(x);return x;};
  const first=win?mk(t('cont'),'big',()=>{$('#overOv').hidden=true;endState=null;S.paused=false;}):mk(t('again'),'big',play);
  mk(t('maps'),'',toMenu);
  return first;
}
function showEnd(win){
  endState=win;if(win)S.paused=true;
  setTimeout(()=>{if(!S||endState!==win)return;const first=renderEnd(win);$('#overOv').hidden=false;first.focus({preventScroll:true});},win?300:600);
}
function gameOver(){S.over=true;S.inWave=false;saveBest();showEnd(false);}
function play(){
  $('#menu').hidden=true;$('#game').hidden=false;$('#stats').hidden=false;$('#overOv').hidden=true;$('#pauseOv').hidden=true;endState=null;
  newGame();running=true;last={};$('#speedBtn').textContent='x1';$('#mapName').textContent=M.name[lang];updUI();
}
$('#playBtn').onclick=play;
function toMenu(){running=false;S=null;endState=null;$('#overOv').hidden=true;$('#pauseOv').hidden=true;$('#game').hidden=true;$('#stats').hidden=true;$('#menu').hidden=false;$('#selPanel').hidden=true;$('#nextW').innerHTML='';applyLang();window.scrollTo(0,0);}
$('#quitBtn').onclick=toMenu;
$('#go').onclick=startWave;$('#repairBtn').onclick=repair;
$('#speedBtn').onclick=()=>{if(!S)return;S.speed=S.speed===1?2:S.speed===2?3:1;$('#speedBtn').textContent='x'+S.speed;};
function togglePause(){if(!S||S.over||!$('#overOv').hidden)return;S.paused=!S.paused;$('#pauseOv').hidden=!S.paused;if(S.paused)$('#resumeBtn').focus({preventScroll:true});}
$('#pauseBtn').onclick=togglePause;$('#resumeBtn').onclick=togglePause;

function cellAt(e){const r=cv.getBoundingClientRect();return{c:Math.floor((e.clientX-r.left)/r.width*COLS),r:Math.floor((e.clientY-r.top)/r.height*ROWS)};}
let isMouse=true;
cv.addEventListener('pointermove',e=>{if(S)S.hover=cellAt(e);});
cv.addEventListener('pointerleave',()=>{if(S&&isMouse)S.hover=null;});
cv.addEventListener('pointerdown',e=>{
  if(!S||S.over||S.paused)return;isMouse=e.pointerType==='mouse';
  const p=cellAt(e);S.hover=p;
  if(S.build){place(S.build,p.c,p.r);return;}
  selectUnit(S.grid.get(p.c+','+p.r)||null);
});
window.addEventListener('keydown',e=>{
  if(!S||!running||e.target.tagName==='INPUT')return;
  const i=KEYS.indexOf(e.key.toLowerCase());
  if(i>=0){const k=ORDER[i];setBuild(S.build===k?null:k);e.preventDefault();}
  else if(e.key===' '){startWave();e.preventDefault();}
  else if(e.key==='p'||e.key==='P')togglePause();
  else if(e.key==='Escape'){setBuild(null);selectUnit(null);}
});

let prev=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-prev)/1000);prev=now;
  if(S&&running&&!S.paused&&!S.over){for(let i=0;i<S.speed;i++)update(dt);updUI();}
  else{T+=dt;if(S&&S.over){for(const p of S.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;}S.parts=S.parts.filter(p=>p.life>0);}}
  draw();requestAnimationFrame(loop);
}
window.addEventListener('resize',()=>resize());
if(window.ResizeObserver)new ResizeObserver(()=>resize()).observe($('#stage'));
loadMap(mapIdx);renderMaps();applyLang();requestAnimationFrame(loop);
})();

/* Altezza per l'iframe della pagina madre */
(()=>{
  let inFrame;try{inFrame=window.self!==window.top}catch(e){inFrame=true}
  if(!inFrame||!window.parent)return;
  let lastH=0,raf=0;
  const send=()=>{raf=0;const h=Math.ceil(document.getElementById('app').getBoundingClientRect().height+parseFloat(getComputedStyle(document.documentElement).paddingTop||0)+parseFloat(getComputedStyle(document.documentElement).paddingBottom||0));
    if(h&&h!==lastH){lastH=h;try{window.parent.postMessage({type:'il-forte-height',height:h},'*')}catch(e){}}};
  const queue=()=>{if(!raf)raf=requestAnimationFrame(send);};
  if(window.ResizeObserver)new ResizeObserver(queue).observe(document.getElementById('app'));
  window.addEventListener('load',queue);queue();
})();
</script>
</body>
</html>
